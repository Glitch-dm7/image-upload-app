name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Single workspace install (see root package.json) rather than
      # installing frontend/ and backend/ separately.
      - name: Install dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint --workspace backend

      - name: Lint frontend
        run: npm run lint --workspace frontend

      # Backend tests need no secrets: unit tests are pure/fixture-based,
      # and integration tests run against PGlite (embedded Postgres) and an
      # in-memory storage fake instead of real Neon/Supabase - see
      # backend/test/helpers/testDb.ts and fakeStorage.ts.
      - name: Backend tests (unit + integration)
        run: npm run test --workspace backend

      - name: Frontend tests
        run: npm run test --workspace frontend

      - name: Build backend
        run: npm run build --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend
